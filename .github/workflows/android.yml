name: Android CI

on:
  push:
    branches: [ main, master, rebuild-v2, reverse-v3 ]
  pull_request:
    # reverse-v3 is the reconstruction integration branch: every methods/*
    # PR must pass the real Gradle build and packaged-APK contract here.
    branches: [ main, master, reverse-v3 ]
  workflow_dispatch:

jobs:
  # Fast evidence lane: artifact-only contract tests, seconds to run. The lane the loop lives on.
  contracts:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
        fetch-depth: 0
    - name: Validate render contract
      run: python3 tools/validate_render_contract.py
      working-directory: .

    - name: Validate runtime lifecycle contract
      run: python3 tools/validate_runtime_contract.py
      working-directory: .

    - name: Load-time sound list is regenerated from its artifacts
      run: |
        python3 tools/gen_sound_preload_list.py --wiring reconstruction/reverse-v3/native/audio_wiring_map.json \
          --coverage reconstruction/reverse-v3/native/audio_asset_coverage.json \
          --out reconstruction/recovered/sound_preload_list.h --check
      working-directory: .

    - name: Validate reverse evidence contract
      run: python3 tools/validate_reverse_evidence.py
      working-directory: .

    - name: Test item id alignment evidence contract
      run: python3 tools/test_item_id_alignment_evidence.py
      working-directory: .

    - name: Test tile content render map contract
      run: python3 tools/test_tile_content_render_map.py
      working-directory: .

    - name: Test tile record header cross-check
      run: python3 tools/test_tile_record_header_crosscheck.py
      working-directory: .

    - name: Test grp identifiers contract
      run: python3 tools/test_grp_identifiers.py
      working-directory: .

    - name: Test live runtime ivars contract
      run: python3 tools/test_live_runtime_ivars.py
      working-directory: .

    - name: Test live frame stack contract
      run: python3 tools/test_live_frame_stack.py
      working-directory: .

    - name: Test blockhead clothing pipeline contract
