name: Android CI

on:
  push:
    branches: [ main, master, rebuild-v2, reverse-v3 ]
  pull_request:
    # reverse-v3 is the reconstruction integration branch: every methods/*
    # PR must pass the real Gradle build and packaged-APK contract here.
    branches: [ main, master, reverse-v3 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
        fetch-depth: 0

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        # Google removed the legacy `tools` package from the SDK repository;
        # the action's default (`tools platform-tools`) now hard-fails the
        # install. The image already ships cmdline-tools/platform-tools, and
        # setup-java+AGP resolve the rest via licenses below.
        packages: ""

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      working-directory: .

    - name: Validate render contract
      run: python3 tools/validate_render_contract.py
      working-directory: .

    - name: Validate runtime lifecycle contract
      run: python3 tools/validate_runtime_contract.py
      working-directory: .

    - name: Validate reverse evidence contract
      run: python3 tools/validate_reverse_evidence.py
      working-directory: .

    - name: Test item id alignment evidence contract
      run: python3 tools/test_item_id_alignment_evidence.py
      working-directory: .

    - name: Test tile content render map contract
      run: python3 tools/test_tile_content_render_map.py
      working-directory: .

    - name: Test tile record header cross-check
      run: python3 tools/test_tile_record_header_crosscheck.py
      working-directory: .

    - name: Test ObjC send-channel probe contract
      run: python3 tools/test_objc_send_channel.py
      working-directory: .

    - name: Test audio API surface contract
      run: python3 tools/test_audio_api_surface.py
      working-directory: .

    - name: Test item mapping contract
      run: python3 tools/test_item_mapping_functions.py
      working-directory: .

    - name: Test item predicate matrix contract
      run: python3 tools/test_item_predicates.py
      working-directory: .

    - name: Test craftable-item struct contract
      run: python3 tools/test_craftable_item_struct.py
      working-directory: .

    - name: Test tile record save-data contract
      run: python3 tools/test_tile_record_save_data.py
      working-directory: .

    - name: Test tile record layout contract
      run: python3 tools/test_tile_record_layout.py
      working-directory: .

    - name: Test shared-body constants join contract
      run: python3 tools/test_shared_body_constants.py
      working-directory: .

    - name: Test draw-value domains contract
      run: python3 tools/test_draw_value_domains.py
      working-directory: .

    - name: Test tile shared-body structure contract
      run: python3 tools/test_tile_shared_body_structure.py
      working-directory: .

    - name: Test item display-name source audit
      run: python3 tools/test_item_display_name_sources.py
      working-directory: .

    - name: Run every contract test with a bounded timeout
      run: python3 tools/run_contract_tests.py --timeout 300 --jobs 4
      working-directory: .

    - name: Check artifact consumers (no stale column reads)
      run: |
        python3 tools/check_artifact_consumers.py
        python3 tools/test_check_artifact_consumers.py
      working-directory: .

    - name: Test text asset inventory contract
      run: python3 tools/test_text_asset_inventory.py
      working-directory: .

    - name: Test sprite cell content contract
      run: python3 tools/test_sprite_cell_content.py
      working-directory: .

    - name: Test atlas geometry contract
      run: python3 tools/test_atlas_geometry_contract.py
      working-directory: .

    - name: Test shader declaration cross-check
      run: python3 tools/test_shader_declaration_crosscheck.py
      working-directory: .

    - name: Test texture resolution sets contract
      run: python3 tools/test_texture_resolution_sets.py
      working-directory: .

    - name: Test tile sprite domain contract
      run: python3 tools/test_tile_sprite_domain.py
      working-directory: .

    - name: Lint evidence scanning (no raw-byte filename regex)
      run: |
        python3 tools/lint_evidence_scan.py
        python3 tools/test_lint_evidence_scan.py
      working-directory: .

    - name: Test font glyph content contract
      run: python3 tools/test_font_glyph_content.py
      working-directory: .

    - name: Test font glyph table contract
      run: python3 tools/test_font_glyph_tables.py
      working-directory: .

    - name: Test shader asset coverage contract
      run: python3 tools/test_shader_asset_coverage.py
      working-directory: .

    - name: Test audio asset coverage contract
      run: python3 tools/test_audio_asset_coverage.py
      working-directory: .

    - name: Test tile content render map contract
      run: python3 tools/test_tile_content_render_map.py
      working-directory: .

    - name: Test item sprite map contract
      run: python3 tools/test_item_sprite_map.py
      working-directory: .

    - name: Test conditional TileType evidence contract
      run: |
        python3 tools/test_tile_conditional_evidence.py
        python3 tools/gen_tile_conditional_table.py --check
      working-directory: .

    - name: Test ClientTileLoader semantic evidence contract
      run: python3 tools/test_clienttileloader_semantics.py
      working-directory: .

    - name: Test reverse coverage ledger
      run: |
        export PYTHONDONTWRITEBYTECODE=1
        python3 tools/test_reverse_coverage_ledger.py
        python3 tools/build_reverse_coverage_ledger.py \
          reconstruction/reverse-v3/native/libApplication_objc_methods.tsv \
          --evidence-root reconstruction/reverse-v3/native \
          --implementation-records reconstruction/reverse-v3/native/implemented_methods.json \
          --json /tmp/reverse-coverage-ledger.json \
          --markdown /tmp/reverse-coverage-ledger.md
        grep -F "Methods: 10478" /tmp/reverse-coverage-ledger.md
        grep -F "semantics | 65" /tmp/reverse-coverage-ledger.md
        grep -F "implemented | 65" /tmp/reverse-coverage-ledger.md
        grep -F "behavior-verified | 0" /tmp/reverse-coverage-ledger.md
      working-directory: .

    - name: Test ARM indirect call index
      run: |
        export PYTHONDONTWRITEBYTECODE=1
        python3 tools/test_arm_indirect_calls.py
        python3 tools/index_arm_indirect_calls.py \
          reconstruction/reverse-v3/native/disasm_draw_frame.txt \
          --output /tmp/indirect-calls-draw-frame.tsv
        python3 tools/index_arm_indirect_calls.py \
          reconstruction/reverse-v3/native/disasm_dynamic_world_update.txt \
          --output /tmp/indirect-calls-dynamic-world-update.tsv
        test "$(($(wc -l < /tmp/indirect-calls-draw-frame.tsv) - 1))" -eq 11
        test "$(($(wc -l < /tmp/indirect-calls-dynamic-world-update.tsv) - 1))" -eq 71
        python3 -c 'import csv; rows=list(csv.DictReader(open("/tmp/indirect-calls-draw-frame.tsv"), delimiter=chr(9))); assert rows and all(r["selector_pair"] == r["receiver_pair"] == r["argument_pair"] == "unknown" for r in rows)'
      working-directory: .

    # These execute the analyzer without r2 or a copyrighted original ELF.
    # OriginalELFTest is a separate local acceptance layer, not claimed by CI.
    - name: Test Objective-C dispatch dataflow (synthetic contracts)
      run: |
        export PYTHONDONTWRITEBYTECODE=1
        python3 tools/test_trace_objc_dispatch.py DispatchDataflowTest
        python3 tools/test_drawframe_slices.py
      working-directory: .

    - name: Test recovered scroll inertia numerical slice
      run: |
        for opt in 0 2; do
          c++ -std=c++17 -O${opt} -Wall -Wextra -Werror -ffp-contract=off \
            -Ireconstruction/recovered tools/test_scroll_inertia.cpp \
            reconstruction/recovered/scroll_inertia.cpp -o /tmp/test_scroll_inertia
          /tmp/test_scroll_inertia
        done

    - name: Test recovered pinch return numerical slice
      run: |
        for opt in 0 2; do
          c++ -std=c++17 -O${opt} -Wall -Wextra -Werror -ffp-contract=off \
            -Ireconstruction/recovered tools/test_pinch_return.cpp \
            reconstruction/recovered/pinch_return.cpp -o /tmp/test_pinch_return
          /tmp/test_pinch_return
        done

    - name: Test recovered pinch inertia numerical slice
      run: |
        for opt in 0 2; do
          c++ -std=c++17 -O${opt} -Wall -Wextra -Werror -ffp-contract=off \
            -Ireconstruction/recovered tools/test_pinch_inertia.cpp \
            reconstruction/recovered/pinch_inertia.cpp -o /tmp/test_pinch_inertia
          /tmp/test_pinch_inertia
        done

    - name: Test recovered translation return numerical slice
      run: |
        for opt in 0 2; do
          c++ -std=c++17 -O${opt} -Wall -Wextra -Werror -ffp-contract=off \
            -Ireconstruction/recovered tools/test_translation_return.cpp \
            reconstruction/recovered/translation_return.cpp -o /tmp/test_translation_return
          /tmp/test_translation_return
        done

    - name: Test recovered primary touch-start dispatch slice
      run: |
        for opt in 0 2; do
          build="/tmp/blockheads-starttouch-O${opt}"
          cmake -S reconstruction/recovered -B "$build" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS_RELEASE="-O${opt} -DNDEBUG"
          cmake --build "$build" --parallel 2 --target test_gameview_starttouch test_gameview_movetouch test_gameview_endtouch test_gameview_canceltouch test_gameview_secondarytouch
          ctest --test-dir "$build" -R '^(gameview_starttouch|gameview_movetouch|gameview_endtouch|gameview_canceltouch|gameview_secondarytouch)$' --output-on-failure
        done

    - name: Test recovered zoom settling paths
      run: |
        python3 tools/test_zoom_settle_evidence.py
        for opt in 0 2; do
          c++ -std=c++17 -O${opt} -Wall -Wextra -Werror -ffp-contract=off \
            -Ireconstruction/recovered tools/test_zoom_settle.cpp \
            reconstruction/recovered/zoom_settle.cpp -o /tmp/test_zoom_settle
          /tmp/test_zoom_settle
        done

    - name: Test recovered initial zoom cap numerical slice
      run: |
        for opt in 0 2; do
          c++ -std=c++17 -O${opt} -Wall -Wextra -Werror -ffp-contract=off \
            -Ireconstruction/recovered tools/test_zoom_initial_cap.cpp \
            reconstruction/recovered/zoom_initial_cap.cpp -o /tmp/test_zoom_initial_cap
          /tmp/test_zoom_initial_cap
        done

    - name: Test complete recovered GameView method batch
      run: |
        export PYTHONDONTWRITEBYTECODE=1
        python3 tools/test_gameview_method_map.py
        python3 tools/test_gameview_init_evidence.py
        CXX=c++ python3 tools/gameview_input_test.py
        c++ -std=c++17 -O2 -DNDEBUG -DSOUND_ASSIGNMENT_NEGATIVE_CONTROL \
          -Ireconstruction/recovered tools/test_sound_manager.cpp reconstruction/recovered/world_translation.cpp \
          -o /tmp/sound-manager-negative
        python3 -c 'import subprocess; p=subprocess.run(["/tmp/sound-manager-negative"],capture_output=True,text=True); print("sound negative control:",p.returncode,p.stderr); assert p.returncode != 0 and "p==&r.allocated" in p.stderr'
        # Prove the new setter assertions survive the Release NDEBUG flag.
        c++ -std=c++17 -O2 -DNDEBUG -DTRANSLATION_ASSIGNMENT_NEGATIVE_CONTROL \
          -Ireconstruction/recovered tools/test_world_translation.cpp \
          -o /tmp/world-translation-negative
        python3 -c 'import subprocess; p=subprocess.run(["/tmp/world-translation-negative"],capture_output=True,text=True); print("setter negative control:",p.returncode,p.stderr); assert p.returncode != 0 and "s.accurateTranslation.x==expected" in p.stderr'
        for opt in 0 2; do
          build="/tmp/blockheads-methods-O${opt}"
          cmake -S reconstruction/recovered -B "$build" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS_RELEASE="-O${opt} -DNDEBUG"
          cmake --build "$build" --parallel 2
          ctest --test-dir "$build" --output-on-failure --verbose
        done

    - name: Test original 1.7.6 save decoder
      run: |
        c++ -std=c++17 -Wall -Wextra -Werror \
          -Iapp/src/main/cpp \
          tools/test_original_save_format.cpp \
          app/src/main/cpp/original_save_format.cpp \
          -lz -o /tmp/test_original_save_format
        /tmp/test_original_save_format
      working-directory: .

    - name: Generate native item data for unit tests
      run: |
        mkdir -p /tmp/blockheads-generated
        python3 tools/process_items.py \
          assets/gamedata/items.json \
          assets/gamedata/recipes.json \
          /tmp/blockheads-generated/game_item_ids.h \
          /tmp/blockheads-generated/game_item_data.cpp \
          /tmp/blockheads-generated/game_recipe_data.h \
          /tmp/blockheads-generated/game_recipe_data.cpp
      working-directory: .

    - name: Test inventory stack limits
      run: |
        c++ -std=c++17 -Wall -Wextra -Werror -ffunction-sections -fdata-sections \
          -I/tmp/blockheads-generated \
          -Iapp/src/main/cpp \
          tools/test_inventory.cpp \
          app/src/main/cpp/entity_manager.cpp \
          -Wl,--gc-sections \
          -o /tmp/test_inventory
        /tmp/test_inventory
      working-directory: .

    - name: Build with Gradle
      run: ./gradlew assembleDebug
      working-directory: .

    - name: Validate packaged APK contract
      run: python3 tools/validate_apk.py app/build/outputs/apk/debug/app-debug.apk
      working-directory: .

    - name: Upload recovered inventory host contracts
      uses: actions/upload-artifact@v4
      with:
        name: recovered-inventory-linux-x86_64
        path: |
          /tmp/blockheads-methods-O2/libblockheads_recovered_inventory.a
          /tmp/blockheads-methods-O2/test_inventory_item
          /tmp/blockheads-methods-O2/test_inventory_capacity
          /tmp/blockheads-methods-O2/test_inventory_rules
          /tmp/blockheads-methods-O2/test_inventory_add
          /tmp/blockheads-methods-O2/test_inventory_chain
          /tmp/blockheads-methods-O2/test_inventory_pickup
          /tmp/blockheads-methods-O2/test_inventory_ownership
          /tmp/blockheads-methods-O2/test_inventory_pickup_currency
        if-no-files-found: error

    - name: Upload recovered GameView touch host contracts
      uses: actions/upload-artifact@v4
      with:
        name: recovered-gameview-touch-linux-x86_64
        path: |
          /tmp/blockheads-methods-O2/test_gameview_starttouch
          /tmp/blockheads-methods-O2/test_gameview_movetouch
          /tmp/blockheads-methods-O2/test_gameview_endtouch
          /tmp/blockheads-methods-O2/test_gameview_canceltouch
          /tmp/blockheads-methods-O2/test_gameview_secondarytouch
        if-no-files-found: error

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk