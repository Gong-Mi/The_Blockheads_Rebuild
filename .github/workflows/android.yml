          reconstruction/reverse-v3/native/libApplication_objc_methods.tsv \
          --evidence-root reconstruction/reverse-v3/native \
          --implementation-records reconstruction/reverse-v3/native/implemented_methods.json \
          --origin-runtime-records reconstruction/reverse-v3/native/origin_runtime_evidence.json \
          --json /tmp/reverse-coverage-ledger.json \
          --markdown /tmp/reverse-coverage-ledger.md
        grep -F "Methods: 10478" /tmp/reverse-coverage-ledger.md
        grep -F "semantics | 71" /tmp/reverse-coverage-ledger.md
        grep -F "implemented | 71" /tmp/reverse-coverage-ledger.md
        grep -F "behavior-verified | 8" /tmp/reverse-coverage-ledger.md
      working-directory: .

    - name: Test ARM indirect call index
      run: |
        export PYTHONDONTWRITEBYTECODE=1
        python3 tools/test_arm_indirect_calls.py
