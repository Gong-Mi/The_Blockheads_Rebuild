name: Android CI

on:
  push:
    branches: [ main, master, rebuild-v2, reverse-v3 ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
        fetch-depth: 0

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      working-directory: .

    - name: Validate render contract
      run: python3 tools/validate_render_contract.py
      working-directory: .

    - name: Validate runtime lifecycle contract
      run: python3 tools/validate_runtime_contract.py
      working-directory: .

    - name: Validate reverse evidence contract
      run: python3 tools/validate_reverse_evidence.py
      working-directory: .

    - name: Test original 1.7.6 save decoder
      run: |
        c++ -std=c++17 -Wall -Wextra -Werror \
          -Iapp/src/main/cpp \
          tools/test_original_save_format.cpp \
          app/src/main/cpp/original_save_format.cpp \
          -lz -o /tmp/test_original_save_format
        /tmp/test_original_save_format
      working-directory: .

    - name: Test inventory stack limits
      run: |
        c++ -std=c++17 -Wall -Wextra -Werror -ffunction-sections -fdata-sections \
          -Iapp/src/main/cpp/generated \
          -Iapp/src/main/cpp \
          tools/test_inventory.cpp \
          app/src/main/cpp/entity_manager.cpp \
          -Wl,--gc-sections \
          -o /tmp/test_inventory
        /tmp/test_inventory
      working-directory: .

    - name: Build with Gradle
      run: ./gradlew assembleDebug
      working-directory: .

    - name: Validate packaged APK contract
      run: python3 tools/validate_apk.py app/build/outputs/apk/debug/app-debug.apk
      working-directory: .

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk