apply plugin: 'com.android.application'

// Read once at the top level: inside the cmake {} closure the delegate is the
// AGP options object, so relying on findProperty there would depend on Groovy's
// owner fallback. A top-level read is unambiguous.
def ccacheLauncher = findProperty("ccacheLauncher")

android {
    ndkVersion "26.1.10909125"
    namespace "com.noodlecake.blockheads.rebuild"
    compileSdkVersion 34

    signingConfigs {
        debug {
            storeFile file('debug.jks')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    defaultConfig {
        applicationId "com.noodlecake.blockheads.rebuild"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
        signingConfig signingConfigs.debug
        externalNativeBuild {
            cmake {
                // The client-assembly path (OriginalClientApp/OriginalClientWorld)
                // uses std::filesystem and std::from_chars: C++17 is a hard
                // requirement of the committed sources, verified by direct
                // compilation (C++11: "no member named 'filesystem'").
                cppFlags "-std=c++17 -frtti -fexceptions"
                // Opt-in ccache: CI passes -PccacheLauncher=<path> so the four
                // per-ABI CMake rounds reuse compiled objects across runs. Without
                // the property the build is byte-for-byte what it was, so a host
                // that has no ccache (a phone, a fresh clone) is unaffected.
                if (ccacheLauncher) {
                    arguments "-DCMAKE_C_COMPILER_LAUNCHER=" + ccacheLauncher,
                              "-DCMAKE_CXX_COMPILER_LAUNCHER=" + ccacheLauncher
                }
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets {
        main {
            assets.srcDirs = ['../assets']
            res.srcDirs = ['src/main/res']
            jniLibs.srcDirs = ['src/main/libs']
        }
    }
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
    dependencies {
        implementation 'androidx.appcompat:appcompat:1.6.1'
    }
}
